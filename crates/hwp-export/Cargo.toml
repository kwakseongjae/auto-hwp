[package]
name = "hwp-export"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
description = "Export the JSX+CSS projection to web-native formats — M1: a standalone self-contained HTML page the browser renders (semantic-reflow). PDF/docx to follow."

[dependencies]
hwp-model = { workspace = true }
hwp-jsx = { workspace = true }
# PDF export from OUR layout (paint IR → krilla). Feature-gated so the DEFAULT build pulls NO heavy
# PDF/font deps and stays network-safe; enable with `--features pdf`.
hwp-render = { workspace = true, optional = true }
hwp-typeset = { workspace = true, optional = true }
krilla = { version = "0.8", optional = true, default-features = false, features = ["simple-text", "raster-images"] }
quick-xml = { workspace = true, optional = true }
svgtypes = { version = "0.16", optional = true }
kurbo = { version = "0.13", optional = true }
serde = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
# 얼굴이 이 코드포인트를 그릴 수 있는지 묻기 위한 것 (이슈 287). krilla 가 이미 끌어오는
# 크레이트라 의존 트리에 새 코드가 늘지 않는다 — hwp-typeset·hwp-session 도 같은 판을 쓴다.
ttf-parser = { version = "0.25", optional = true }

[features]
default = []
# High-level PDF export (krilla): own layout → paint IR → PDF with Korean font subsetting. Pairs with
# the caller's font provider; under `shaper` the real rustybuzz advances drive placement.
pdf = ["dep:krilla", "dep:hwp-render", "dep:hwp-typeset", "dep:quick-xml", "dep:svgtypes", "dep:kurbo", "dep:serde", "dep:sha2", "dep:ttf-parser"]
# Drive the PDF export's placement with the real shaper (forwarded to hwp-render/hwp-typeset).
shaper = ["hwp-render?/shaper", "hwp-typeset?/shaper"]

[dev-dependencies]
hwp-core = { workspace = true, features = ["rhwp"] }
rhwp = { path = "../../external/rhwp" }

[[example]]
name = "svg_pdf_parity"
required-features = ["pdf"]
