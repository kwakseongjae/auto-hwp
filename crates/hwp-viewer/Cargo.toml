[package]
name = "hwp-viewer"
description = "auto-hwp Tauri 2 desktop shell: first-party live layout/render/PDF/editing with rhwp limited to binary HWP decode and read-only original helpers."
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "hwp_viewer_lib"
path = "src/lib.rs"
crate-type = ["lib"]

[[bin]]
name = "hwp-viewer"
path = "src/main.rs"

[features]
# Binary HWP decode/original-reference helpers are ON by default. Live layout/render/PDF remain
# first-party; disabling this feature only removes HWP5/HWP3 input and named read-only helpers.
default = ["rhwp"]
rhwp = ["hwp-core/rhwp", "hwp-mcp/rhwp"]
# In-app AI generation (natural language → AiContent via a provider). Kept SEPARATE from default so
# plain/CI builds stay lean (no reqwest/keyring). Run dev with: cargo tauri dev -f rhwp ai
ai = ["hwp-ai/anthropic", "hwp-ai/keyring", "hwp-ai/local", "hwp-ai/openrouter"]
# Forward the real rustybuzz shaper down to the OWN renderer (hwp-typeset/hwp-render) so the in-app
# "자체 렌더" view's glyph x-positions are real (matches the CLI `own-render --features shaper`). Also
# forwards to hwp-export so the PDF placement uses the real shaper when `pdf` is on.
shaper = ["hwp-typeset/shaper", "hwp-render/shaper", "hwp-export/shaper", "hwp-session/shaper"]
# PDF export (own layout → paint IR → krilla, Korean font subsetting) for the `export_doc_pdf`
# command. SEPARATE from default so plain/CI builds pull NO heavy krilla/font deps; enable with
# `cargo tauri dev -f "rhwp ai pdf"`. Without it `export_doc_pdf` returns a clear error.
pdf = ["hwp-export/pdf", "hwp-session/pdf"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
hwp-core = { workspace = true }
hwp-mcp = { workspace = true }
# Shell-independent document-session logic (issue 012): DTO assembly, own-engine geometry queries,
# styled-run reads, HTML/PDF export projection, image-insert proposal. The Tauri commands are thin
# wrappers over this. `fs` = the path-based `stash_image` (this shell always has a filesystem).
hwp-session = { workspace = true, features = ["fs"] }
hwp-ops = { workspace = true }
hwp-ai = { workspace = true }
hwp-model = { workspace = true }
# JSX(content)/CSS(design) → HTML preview path (the pivot's render): emit + emit_html on the live doc.
hwp-jsx = { workspace = true }
hwp-export = { workspace = true }
# OUR OWN engine: place_doc (hwp-typeset) → paint IR → SvgSink (hwp-render) for the in-app "자체 렌더"
# fidelity view — the self-owned render path (no rhwp), same code the CLI `own-render` subcommand runs.
hwp-typeset = { workspace = true }
hwp-render = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# A3 embedded control server uses pure std::net + these (already in the workspace lock):
subtle = "2"
getrandom = "0.3"
# Decode chat-attached images (base64 over IPC) before stashing them to a temp file for insertion.
base64 = "0.21"
# OS clipboard for own-mode copy/paste — the WKWebView's navigator.clipboard.readText is unreliable
# (no browser-grade permission/gesture pipeline under our strict CSP), so read/write go through here.
arboard = "3"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
# Issue #140: the first registered plugin routes warm file-association launches back to the one
# shared Rust session/window. It owns no document behavior.
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# Issue #143: hand the already-produced own-engine PDF bytes to PDFKit/AppKit's native print
# operation. No webview print/layout path and no temporary file are involved.
objc2 = { version = "0.6", features = ["catch-all"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPrintInfo", "NSPrintOperation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSString"] }
