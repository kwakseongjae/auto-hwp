name: publish

# npm 발행 워크플로 (issue 063 블로커 3). **수동 전용**(workflow_dispatch) — 이 레포의 CI 원칙(2026-07-11
# 로컬 검증 우선, Actions 는 수동 트리거)을 그대로 따른다. 자동 발행 없음.
#
# 발행 순서는 의존 위상 그대로: engine → editor-core → ai-protocol → react
#   (react만 engine/editor-core에 실버전 의존을 갖는다. publish:safe가 build→file: 치환→publish→finally
#   복원을 소유해, npm 실패가 source manifest를 publish 모드로 남기지 않는다.)
# engine/editor-core/ai-protocol의 prepack 훅과 react의 publish:safe가 pkg/dist를 채운다.
#
# 안전장치: dry_run 입력이 기본 true — 실제 레지스트리 반영 없이 `npm publish --dry-run` 으로 검증만 한다.
# 실제 발행하려면 워크플로 실행 시 dry_run=false 로 명시해야 한다(npm unpublish 제약 — 되돌리기 어려움).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true면 --dry-run(레지스트리 미반영). 실제 발행은 false."
        type: boolean
        default: true

# 동시 발행 방지(레이스 → 부분 발행 위험).
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # 발행 인증은 npm Trusted Publishing(OIDC)이다(#494, 2026-10-23). 장기 토큰(secrets.NPM_TOKEN)을 쓰지 않는다 —
    # 7/22 토큰이 만료(E401)돼 0.0.18 이 막혔고, 쓰기 토큰은 최대 90일이라 같은 일이 반복된다.
    # id-token: write 가 있어야 npm CLI(11.5.1+)가 GitHub OIDC 토큰을 받아 레지스트리 단기 토큰으로 바꾼다.
    permissions:
      contents: read
      id-token: write
    env:
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive # external/rhwp — engine wasm 빌드에 필요(cargo resolve)

      # 빌드 툴체인을 설치하기 전에 발행 인증을 fail-fast 검증한다. `npm publish --dry-run`은 인증 없이도
      # 성공할 수 있고, OIDC 에는 whoami 가 없다 — 그래서 네 패키지 각각의 토큰 교환을 직접 해 본다.
      # 하나라도 실패하면(그 패키지에 trusted publisher 가 없거나 저장소 · 워크플로 이름이 다르면) 아무것도 발행하지 않는다.
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19
          registry-url: "https://registry.npmjs.org"
      - name: npm 11 (trusted publishing 은 npm 11.5.1 이상)
        run: npm install -g npm@11.13.0 && npm --version
      - name: verify npm trusted publishing (OIDC 교환, 네 패키지)
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::id-token: write 권한이 없어 OIDC 토큰을 받을 수 없다"
            exit 1
          fi
          FAILED=""
          for PACKAGE in @auto-hwp/engine @auto-hwp/editor-core @auto-hwp/ai-protocol @auto-hwp/react; do
            ID_TOKEN="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).value||"")}catch{}})')"
            if [ -z "$ID_TOKEN" ]; then echo "::error::GitHub OIDC 토큰을 받지 못했다"; exit 1; fi
            echo "::add-mask::$ID_TOKEN"
            ESCAPED="${PACKAGE/\//%2f}"
            CODE="$(curl -sS -o exchange.json -w '%{http_code}' -X POST -H "Authorization: Bearer $ID_TOKEN" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$ESCAPED" || true)"
            # 받은 단기 토큰은 출력하지 않는다 — 있었는지와 오류 메시지만 본다
            RESULT="$(node -e 'try{const j=JSON.parse(require("fs").readFileSync("exchange.json","utf8"));process.stdout.write(j.token?"ok":("fail: "+(j.message||j.error||"no token")))}catch{process.stdout.write("fail: unreadable body")}')"
            rm -f exchange.json
            echo "$PACKAGE exchange http=$CODE $RESULT"
            # 첫 실패에서 멈추지 않고 네 패키지를 다 본다 — 어느 패키지 설정이 빠졌는지 한 번에 알 수 있게
            [ "$RESULT" = "ok" ] || FAILED="$FAILED $PACKAGE"
          done
          if [ -n "$FAILED" ]; then
            echo "::error::trusted publisher 교환 실패:$FAILED — npmjs.com 패키지 설정의 Trusted Publisher(kwakseongjae · auto-hwp · publish.yml · 환경 비움)를 확인"
            exit 1
          fi

      # engine prepack(build-wasm.mjs)이 쓰는 Rust 툴체인 + wasm-bindgen(=0.2.125, Cargo.toml 과 정확히 일치).
      - uses: dtolnay/rust-toolchain@1.95
        with:
          targets: wasm32-unknown-unknown
      - name: install wasm-bindgen-cli (=0.2.125)
        run: cargo install wasm-bindgen-cli --version 0.2.125 --locked

      # 최신 binaryen 공식 릴리스 사용 — apt 는 108(2022)이라 최신 rustc wasm 에서 wasm-opt 가 실패해
      # 조용히 미적용됐다(2026-07-22 실측: 배포/발행본 11.4MB vs 로컬 8.07MB). 119 로 고정 설치.
      - name: install binaryen (wasm-opt -Oz 다이어트)
        run: |
          curl -sL https://github.com/WebAssembly/binaryen/releases/download/version_119/binaryen-version_119-x86_64-linux.tar.gz | tar xz -C /tmp
          echo "/tmp/binaryen-version_119/bin" >> "$GITHUB_PATH"
          /tmp/binaryen-version_119/bin/wasm-opt --version

      # 발행 순서: engine → editor-core → ai-protocol → react. 각 패키지 install(파일: 심링크/devDeps) 후
      # publish(build + tarball 채움). react install 시점엔 engine/editor-core 의 dist/pkg 가 이미
      # 앞 단계에서 디스크에 생성돼 있으므로 vite 빌드가 editor-core dist 를 resolve 한다.
      - name: publish @auto-hwp/engine
        working-directory: packages/engine
        run: |
          PACKAGE="@auto-hwp/engine"
          VERSION="$(node -p "require('./package.json').version")"
          npm install --no-audit --no-fund
          if npm view "$PACKAGE@$VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            # fresh runner 에는 react 가 file: 로 읽을 pkg/가 없으므로 publish 만 건너뛰고 로컬 산출물은 만든다.
            npm run build
            echo "$PACKAGE@$VERSION already published; skipping publish"
            exit 0
          fi
          # #364 — wasm-opt 결과가 Node 에서 안 열리는 사고(로컬 binaryen 132)를 발행 전에 막는다: 빌드만 먼저 하고
          # Node 로 컴파일 · 인스턴스화해 본 뒤 크기(cdn.js WASM_BYTES 와 같아야 한다)를 찍는다. 실패하면 발행하지 않는다
          npm run build
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const bytes = readFileSync('pkg/hwp_wasm_bg.wasm');
            await WebAssembly.compile(bytes);
            const glue = await import(process.cwd() + '/pkg/hwp_wasm.js');
            glue.initSync({ module: bytes });
            const declared = Number(readFileSync('cdn.js', 'utf8').match(/export const WASM_BYTES = (\d+)/)[1]);
            console.log('wasm compiles + instantiates in Node; WASM_BYTES=' + bytes.length + ' (cdn.js ' + declared + ')');
            if (declared !== bytes.length) console.log('::warning::cdn.js WASM_BYTES ' + declared + ' != built ' + bytes.length);
          "
          PUBLISH_ARGS=(--access public)
          [ "$DRY_RUN" = "true" ] && PUBLISH_ARGS+=(--dry-run)
          npm publish "${PUBLISH_ARGS[@]}"

      - name: publish @auto-hwp/editor-core
        working-directory: packages/editor-core
        run: |
          PACKAGE="@auto-hwp/editor-core"
          VERSION="$(node -p "require('./package.json').version")"
          npm install --no-audit --no-fund
          if npm view "$PACKAGE@$VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            # react build가 file: dependency의 dist를 읽으므로 부분 재개에서도 로컬 build는 필요하다.
            npm run build
            echo "$PACKAGE@$VERSION already published; skipping publish"
            exit 0
          fi
          PUBLISH_ARGS=(--access public)
          [ "$DRY_RUN" = "true" ] && PUBLISH_ARGS+=(--dry-run)
          npm publish "${PUBLISH_ARGS[@]}"

      - name: publish @auto-hwp/ai-protocol
        working-directory: packages/ai-protocol
        run: |
          PACKAGE="@auto-hwp/ai-protocol"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$PACKAGE@$VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "$PACKAGE@$VERSION already published; skipping publish"
            exit 0
          fi
          npm install --no-audit --no-fund
          PUBLISH_ARGS=(--access public)
          [ "$DRY_RUN" = "true" ] && PUBLISH_ARGS+=(--dry-run)
          npm publish "${PUBLISH_ARGS[@]}"

      - name: publish @auto-hwp/react
        working-directory: packages/react
        run: |
          PACKAGE="@auto-hwp/react"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$PACKAGE@$VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "$PACKAGE@$VERSION already published; skipping publish"
            exit 0
          fi
          npm install --no-audit --no-fund
          PUBLISH_ARGS=(--access public)
          [ "$DRY_RUN" = "true" ] && PUBLISH_ARGS+=(--dry-run)
          npm run publish:safe -- "${PUBLISH_ARGS[@]}"
