name: ci

# 로컬 정본은 여전히 `scripts/verify-local.sh`다. 외부 PR에는 비밀·배포 권한 없이 실행 가능한 bounded
# 레인(fmt/clippy/native/wasm/license + 데스크톱 어댑터 계약 vitest + 런칭 정적 계약)만 자동으로 건다.
# 전체 JS/e2e/배포는 RC 로컬 게이트다. 계약 테스트(#64)는 build-test의 node 스텝이 없으면 CI에서 안 돈다.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  issue-link:
    name: issue-link
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require a closing issue reference
        uses: actions/github-script@v8
        with:
          script: |
            const body = context.payload.pull_request?.body ?? "";
            const closesIssue = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#[0-9]+\b/i.test(body);
            if (!closesIssue) {
              core.setFailed("PR 본문에 `Closes #<issue>`를 적어 주세요. 모든 변경은 공개 이슈에서 시작합니다.");
            }

  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive   # external/rhwp is an optional path-dep; needed for cargo resolve
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test (native)
        run: cargo test --workspace
      - name: wasm hygiene (pure core compiles to wasm32)
        run: cargo check -p hwp-model -p hwp-ops -p hwp-ingest --target wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/react/package-lock.json
      - name: desktop workspace shell launch contract
        run: node --test scripts/tests/desktop-shell-mode.test.mjs
      - name: public corpus safety and metadata contracts
        run: |
          node --test \
            scripts/tests/gov-sources.test.mjs \
            scripts/tests/fetch-gov-corpus.test.mjs \
            scripts/tests/gov-source-catalog.test.mjs \
            scripts/tests/public-corpus-manifest.test.mjs \
            scripts/tests/safe-document-download.test.mjs \
            scripts/tests/oracle-sweep.test.mjs
          node scripts/gov-source-catalog.mjs --check
          node scripts/public-corpus-intake.mjs --check
          node scripts/oracle-sweep.mjs --check-committed
      - name: canonical layout gate (issue 98 — bounded three-document run)
        run: |
          node --test scripts/tests/canonical-layout-gate.test.mjs
          cargo run -q -p auto-hwp-cli --features "shaper rhwp" -- \
            layout-check --json \
            benchmarks/benchmark.hwp \
            benchmarks/benchmark1.hwp \
            benchmarks/benchmark2.hwp \
            | node scripts/canonical-layout-gate.mjs
      - name: PDF visual oracle foundation (issue 121)
        run: python3 -m unittest discover -s scripts/tests -p 'test_pdf_visual_check.py'
      - name: desktop adapter contract (vitest)
        working-directory: packages/react
        run: npm ci && npx vitest run src/__tests__/desktopParity.contract.test.ts
      - name: launch docs and trust contracts
        run: scripts/verify-launch.sh --automated

  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive   # external/rhwp is an optional path-dep; needed for cargo resolve
      - uses: dtolnay/rust-toolchain@1.95
      - run: cargo install cargo-deny --locked
      - run: cargo deny check licenses
