name: ci

# 로컬 정본은 여전히 `scripts/verify-local.sh`다. 외부 PR에는 비밀·배포 권한 없이 실행 가능한 bounded
# 레인(fmt/clippy/native/wasm/license + 런칭 정적 계약)만 자동으로 건다. 전체 JS/e2e/배포는 RC 로컬 게이트다.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive   # external/rhwp is an optional path-dep; needed for cargo resolve
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test (native)
        run: cargo test --workspace
      - name: wasm hygiene (pure core compiles to wasm32)
        run: cargo check -p hwp-model -p hwp-ops -p hwp-ingest --target wasm32-unknown-unknown
      - name: launch docs and trust contracts
        run: scripts/verify-launch.sh --automated

  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive   # external/rhwp is an optional path-dep; needed for cargo resolve
      - uses: dtolnay/rust-toolchain@1.95
      - run: cargo install cargo-deny --locked
      - run: cargo deny check licenses
