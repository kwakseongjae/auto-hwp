<!doctype html>
<meta charset="utf-8" />
<style>
  /* 라이브 랜딩(라이트) 토큰 그대로 — apps/hwp-lab/src/app/globals.css :root[data-theme="light"] */
  :root {
    --ah-bg: #f5f6fb;
    --ah-fg-strong: #0a0f1c;
    --ah-muted: #5a6274;
    --ah-accent-ink: #6d28d9;
    --ah-accent-ink-2: #7c3aed;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 420px; }
  body {
    background: var(--ah-bg);
    font-family: "Apple SD Gothic Neo", -apple-system, system-ui, "Segoe UI", "Malgun Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .hero { position: relative; width: 1280px; height: 420px; overflow: hidden; }

  /* 라이브 배경 공식: 은은한 보라/파랑 글로우 (--ah-glow-1/2).
     ⚠️ 장면(.scene)이 불투명 #f5f6fb 사각형이라 그 아래에 깔면 사각 이음매가 보인다 —
     반드시 장면 '위'에 얹어 화면 전체를 균일하게 물들인다. */
  .glow {
    position: absolute; inset: 0; pointer-events: none; z-index: 3;
    background:
      radial-gradient(760px 420px at 88% 6%, rgba(124, 58, 237, 0.10), transparent 66%),
      radial-gradient(620px 380px at 99% 78%, rgba(37, 99, 235, 0.07), transparent 70%);
  }
  /* 라이브 배경의 아주 흐린 수평 그리드(--ah-grid, 4.5%) — 장면에 겹치지 않게 왼쪽에서 끊는다 */
  .grid {
    position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background-image: repeating-linear-gradient(
      to bottom,
      rgba(15, 23, 42, 0.045) 0 1px,
      transparent 1px 34px
    );
    -webkit-mask-image: linear-gradient(to right, #000 0%, #000 38%, transparent 54%);
            mask-image: linear-gradient(to right, #000 0%, #000 38%, transparent 54%);
  }

  /* codex(gpt-image) 생성 장면 — 배경이 정확히 #f5f6fb 단색이라 이음매 없이 얹힌다 */
  .scene {
    position: absolute;
    right: 46px;
    top: 50%;
    transform: translateY(-50%);
    width: 486px;      /* 945x696 비율 유지(1.3578) */
    height: 358px;
    background: url("hero-scene.png") center/contain no-repeat;
    z-index: 2;
  }

  .copy {
    position: absolute; left: 68px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; align-items: flex-start;
    z-index: 4;
  }
  .kicker {
    font-size: 13px; font-weight: 600; letter-spacing: 4.6px;
    color: var(--ah-muted); white-space: nowrap;
  }
  .kicker b { color: var(--ah-accent-ink); font-weight: 800; }

  .titleRow { display: flex; align-items: center; margin-top: 12px; }
  /* 워드마크는 실폰트 합성이 아니라 **붓글씨 원본**(wordmark.png)이다 — 라이브 랜딩의
     .lab-mark 와 같은 자산이라 배너와 사이트의 톤이 어긋나지 않는다. */
  .mark {
    width: 404px; height: 112px;      /* 960x266 비율(3.609) 유지 */
    background: url("wordmark.png") left center / contain no-repeat;
    filter: drop-shadow(0 5px 20px rgba(124, 58, 237, 0.18));
  }
  /* ⚠️ 예전 배너의 점멸 커서(.caret) 블록은 뺐다 — 붓획 옆에 붙은 직각 막대가 이물감을 주고,
     "편집기"라는 신호는 오른쪽 장면 일러스트와 낙관이 이미 하고 있다. 라이브 랜딩에서는
     커서가 **애니메이션**으로 제 역할을 하므로 거기서는 그대로 둔다. */

  /* 낙관은 글 끝에 찍는다 — 태그라인 오른쪽에 붙여 '서명 + 도장'으로 읽히게 한다.
     (캔버스 우하단은 장면 일러스트가 차지하고 있어 거기에는 놓을 수 없다.) */
  .taglineRow { display: flex; align-items: center; gap: 24px; margin-top: 21px; }
  .tagline {
    font-size: 23px; font-weight: 700; letter-spacing: -0.4px;
    color: var(--ah-fg-strong); white-space: nowrap;
  }
  .seal {
    width: 50px; height: 51px; flex: 0 0 auto; transform: translateY(5px);
    background: url("seal.png") center / contain no-repeat;
  }
</style>
<div class="hero">
  <div class="glow"></div>
  <div class="grid"></div>
  <div class="scene"></div>
  <div class="copy">
    <div class="kicker">한글 문서를 직접 다루는 엔진</div>
    <div class="titleRow">
      <span class="mark"></span>
    </div>
    <div class="taglineRow">
      <div class="tagline">AI와 함께, 한 화면을 보면서 쓰는 한글</div>
      <div class="seal"></div>
    </div>
  </div>
</div>
