name = "autohwp-demo-ai"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# 일일 카운터 저장소(IP별 + 전체). 배포 전 1회 생성 후 아래 id를 채운다:
#   wrangler kv namespace create RATELIMIT
[[kv_namespaces]]
binding = "RATELIMIT"
id = "77e71126e0534967932807bd012bc39a"

[vars]
# CORS 허용 오리진(정확히 일치, 콤마로 여러 개). Pages 프로젝트 페이지면 뒤에 경로 없이 오리진만.
ALLOWED_ORIGIN = "https://kwakseongjae.github.io"
MODEL = "openai/gpt-5.6-luna"
# 비용 방어선: GPT-5.6 Luna($0.10/M 입력 · $0.60/M 출력). MAX_TOKENS를 1024 → 2048로 올렸다
# (이슈 1-(1): 추론 토큰이 max_tokens에 함께 계산돼 다중 셀 채움 JSON이 잘리고 전량 드롭됐다 —
#  실측 1필드 OK / 2필드 OK / 5필드 0건, 컨텍스트를 758자로 줄여도 0건 = 출력 예산이 벽).
# 재계산(DAILY_CAP 2000 유지, 매 요청이 입력·출력 상한을 동시에 다 쓴다는 최악 가정):
#   출력 2,048 tok × $0.60/M                     = $0.001229
#   입력 12,483 tok × $0.10/M                    = $0.001248
#     (시스템 13,022자 영문 3,256 + instruction 1,500자 1,050 + docContext 8,000자 4,800
#      + anchors JSON 8,192자 3,277 + 펜스 100 — 환산계수 영문0.25/한글0.7/혼합0.6/구조JSON0.4)
#   요청당 ≈ $0.00248 → × 2000 = $4.95/일 (< $5) ✓
#   실측 시나리오(docContext 3,259자)는 요청당 ≈ $0.0017이고 대부분 출력 상한을 다 안 써서 $1~2/일.
# ⚠ 이 계산은 src/index.ts DEMO_REQUEST_LIMITS(instruction 1500 · docContext 8000 · anchors JSON
#   8192)에 의존한다 — 입력 상한이나 MAX_TOKENS를 바꾸면 여기 수치도 같이 고쳐라.
# KV는 eventual consistency라 동시 요청의 절대 상한이 아니며, 운영 전 Durable Object 카운터로 승격한다.
# (Gemini Flash-Lite는 더 싸지만 Cloudflare Worker 출구 리전을 구글이 지역 차단해 구글 계열은 제외.
#  ⚠ 모델을 바꾸면 이 캡도 새 단가로 반드시 재계산할 것 — src/index.ts DEFAULT_MODEL 주석과 함께.)
DAILY_CAP = "2000"
PER_IP_CAP = "20"
MAX_TOKENS = "2048"
# 추론 노력: 구조화 추출이라 깊은 추론이 불필요하고, 추론 토큰이 출력 예산을 먹어 절단을 유발했다.
# "minimal"|"low"|"medium"|"high" 중 하나, 빈 문자열이면 상류에 필드를 안 보낸다(즉시 롤백 스위치).
REASONING_EFFORT = "low"

# 키는 vars가 아니라 secret으로(레포/설정에 안 남는다):
#   wrangler secret put OPENROUTER_API_KEY
